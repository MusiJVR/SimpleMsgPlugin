    not_send_youself: '<color:#ffff55>You cannot send message yourself</color>'
    sender_pattern: '<b><color:#55ffff>[</color></b><color:#ffff55><sender></color> <b><color:#55ffff>-></color></b> <color:#ffff55><receiver></color><b><color:#55ffff>]</color></b> <color:#ffff55><message></color>'
    receiver_pattern: '<b><color:#55ffff>[</color></b><color:#ffff55><sender></color> <b><color:#55ffff>-></color></b> <color:#ffff55><receiver></color><b><color:#55ffff>]</color></b> <color:#ffff55><message></color>'
    click_send_reply: 'Click to send reply message'
