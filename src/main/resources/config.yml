      usage: '<color:#ffff55>Usage: /msgprop confirm_sending <on | off></color>'
      property_set: '<color:#55ffff>Property</color> <b><color:#ffff55><property></color></b> <color:#55ffff>is set to</color> <b><color:#ffff55><value></color></b>'

  playermsg:
