# Plugin version 1.7.5

send_msg_yourself: false
# This item is needed to be able to send a message to yourself
# Accepts only values 'true' and 'false'

default_sound: 'false'
# By default, the sound is turned off 'false', but you can change it
# It is necessary to indicate the name of the sound in uppercase and with underscores
# Example - msgsound: 'entity.player.levelup'
# All sounds you can find here - https://minecraft.fandom.com/wiki/Sounds.json/Bedrock_Edition_values
# Unfortunately not all of these sounds can be reproduced correctly
# Therefore, if the sound doesn't work and gives an error, then you should change the sound

default_volume: 50
# By default, the volume of notification sounds is set to '50', but it can be changed
# The volume value must be specified in the range from '0' to '100'

privatechat_start_char: '?'
# Start character for sending messages to private chat

confirm_sending: true
# Confirmation of sending an offline message

messages:
  incorrect_command: '<color:#ffff55>The command is specified incorrectly</color>'
  invalid_player: '<color:#ffff55>Invalid player value</color>'

  reloadmsg:
    reload_successfully: '<color:#55ffff>The plugin was successfully reloaded</color>'

  propertiesmsg:
    unknown_property: '<color:#ffff55>Unknown property</color>'
    usage: '<color:#ffff55>Usage: /propmsg <property> <value></color>'
