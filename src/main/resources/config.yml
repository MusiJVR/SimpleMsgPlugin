  help_message: '<b><color:#55ffff>⏴-------</color><color:#ffff55>SimpleMsgPlugin</color><color:#55ffff>-------⏵</color></b>
  
  <color:#55ffff>Command:</color> <color:#ffff55>msghelp</color>
  
  <color:#55ffff>Description:</color> <color:#ffff55>This command allows you to display all possible plugin commands</color>
  
  <color:#55ffff>Usage:</color> <color:#ffff55>/<command></color>
  
  
  <color:#55ffff>Command:</color> <color:#ffff55>msgrc</color>
  
  <color:#55ffff>Description:</color> <color:#ffff55>This command allows you to reload the plugin config</color>
  
  <color:#55ffff>Usage:</color> <color:#ffff55>/<command></color>
  
  
  <color:#55ffff>Command:</color> <color:#ffff55>msg</color>
  
  <color:#55ffff>Description:</color> <color:#ffff55>This command allows you to send private messages to the player</color>
  
  <color:#55ffff>Usage:</color> <color:#ffff55>/<command> <player> <message></color>
  
  
  <color:#55ffff>Command:</color> <color:#ffff55>reply</color>
  
  <color:#55ffff>Description:</color> <color:#ffff55>This command allows you to send a private message to the last player who wrote to you</color>
  
  <color:#55ffff>Usage:</color> <color:#ffff55>/<command> <message></color>
  
  
  <color:#55ffff>Command:</color> <color:#ffff55>acceptsend</color>
  
  <color:#55ffff>Description:</color> <color:#ffff55>This command allows you to accept sending an offline message</color>
  
  <color:#55ffff>Usage:</color> <color:#ffff55>/<command></color>
  
  
  <color:#55ffff>Command:</color> <color:#ffff55>msgnotify</color>
  
  <color:#55ffff>Description:</color> <color:#ffff55>This command allows you to change the notification sound</color>
  
  <color:#55ffff>Usage:</color> <color:#ffff55>/<command> <sound> <volume></color>
  
  
  <color:#55ffff>Command:</color> <color:#ffff55>addbl</color>
  
  <color:#55ffff>Description:</color> <color:#ffff55>This command allows you to add players to the blacklist</color>
  
  <color:#55ffff>Usage:</color> <color:#ffff55>/<command> <player></color>
  
  
  <color:#55ffff>Command:</color> <color:#ffff55>removebl</color>
  
  <color:#55ffff>Description:</color> <color:#ffff55>This command allows you to remove players from the blacklist</color>
  
  <color:#55ffff>Usage:</color> <color:#ffff55>/<command> <player></color>
  
  
  <color:#55ffff>Command:</color> <color:#ffff55>showbl</color>
  
  <color:#55ffff>Description:</color> <color:#ffff55>This command allows you to display your blacklist</color>
  
  <color:#55ffff>Usage:</color> <color:#ffff55>/<command></color>
  
  
  <color:#55ffff>Command:</color> <color:#ffff55>mail</color>
  
  <color:#55ffff>Description:</color> <color:#ffff55>This command allows you to view unread messages</color>
  
  <color:#55ffff>Usage:</color> <color:#ffff55>/<command></color>
  
  
  <color:#55ffff>Command:</color> <color:#ffff55>privatechatl</color>
  
  <color:#55ffff>Description:</color> <color:#ffff55>This command allows you to interact with private chats</color>
  
  <color:#55ffff>Usage:</color> <color:#ffff55>/<command> <action> <arg>(if required)</color>
  
  
  <color:#55ffff>Command:</color> <color:#ffff55>msgprop</color>
  
  <color:#55ffff>Description:</color> <color:#ffff55>This command allows you to set player properties</color>
  
  <color:#55ffff>Usage:</color> <color:#ffff55>/<command> <property> <arg></color>
  
  <b><color:#55ffff>⏴----------------------------⏵</color></b>'
