name: '${name}'
prefix: '${prefix}'
description: '${description}'
version: '${version}'

main: com.mousejava.simplemsgplugin.SimpleMsgPlugin
api-version: '${apiVersion}'
folia-supported: true
load: POSTWORLD

authors: ${authors}

permissions:
  simplemsgplugin.helpmsg:
    description: Permission to use command helpmsg
    default: true
  simplemsgplugin.reloadmsg:
    description: Permission to use command msgr
    default: op
  simplemsgplugin.propertiesmsg:
    description: Permission to use command propertiesmsg
    default: true
  simplemsgplugin.playermsg:
    description: Permission to use command msg
    default: true
  simplemsgplugin.replymsg:
    description: Permission to use command reply
    default: true
  simplemsgplugin.acceptsend:
    description: Permission to use command acceptsend
    default: true
  simplemsgplugin.mailmsg:
    description: Permission to use command mail
    default: true
  simplemsgplugin.notificationmsg:
    description: Permission to use command notificationmsg
    default: true
  simplemsgplugin.privatechat:
    description: Permission to use command privatechat
    default: true
  simplemsgplugin.addblacklist:
    description: Permission to use command addbl
    default: true
  simplemsgplugin.removeblacklist:
    description: Permission to use command removebl
    default: true
  simplemsgplugin.showblacklist:
    description: Permission to use command showbl
    default: true
